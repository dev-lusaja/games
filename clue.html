<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clue — Bloc de Hojas de Pistas</title>
  <meta name="description" content="Hoja de pistas virtual para Clue: marca tus investigaciones sin papel." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --c-bg:       #1a0f0c;
      --c-paper:    #e9dcbc;
      --c-paper2:   #f3ead3;
      --c-line:     #b9a679;
      --c-brick:    #8c2b1d;
      --c-cream:    #f6e7b0;
      --c-ink:      #2a1d14;
      --dice-accent: var(--c-brick);
      --dice-face:   var(--c-paper2);
      --dice-pip:    var(--c-ink);
      --dice-text:   var(--c-cream);
      font-family: "Outfit", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      padding: 16px 16px 96px; /* espacio para el botón del dado */
      color: var(--c-ink);
      background-color: var(--c-bg);
      /* Plano de la mansión: cuadrícula del tablero + viñeta */
      background-image:
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.75) 100%),
        linear-gradient(rgba(246,231,176,0.06) 2px, transparent 2px),
        linear-gradient(90deg, rgba(246,231,176,0.06) 2px, transparent 2px),
        linear-gradient(rgba(246,231,176,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(246,231,176,0.03) 1px, transparent 1px),
        linear-gradient(135deg, #3a1410 0%, #1a0f0c 60%);
      background-size: 100% 100%, 160px 160px, 160px 160px, 32px 32px, 32px 32px, 100% 100%;
      background-attachment: fixed;
    }
    .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

    .btn {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--c-cream);
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(246,231,176,0.25);
      border-radius: 8px;
      padding: 10px 12px;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .toolbar { display: flex; gap: 6px; }
    .toolbar .btn { display: inline-flex; align-items: center; gap: 6px; }
    /* Sprite 3×2 de interfaz: --x columna (0-2), --y fila (0-1) */
    .ui {
      flex: none;
      display: inline-block;
      width: 1.3em;
      height: 1.3em;
      border-radius: 4px;
      vertical-align: middle;
      background: url(assets/clue/ui.webp) calc(var(--x) * 50%) calc(var(--y) * 100%) / 300% 200%;
    }
    /* Tono sepia en los títulos para no competir con los colores de las cartas */
    th .ui { filter: sepia(1) saturate(0.6); }
    .toolbar .btn:first-child { margin-right: auto; }

    dialog {
      width: min(320px, 100% - 32px);
      margin: auto;
      border: none;
      border-radius: 8px;
      padding: 20px;
      background: var(--c-paper2);
      color: var(--c-ink);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    dialog::backdrop { background: rgba(0,0,0,0.7); }
    dialog h2 { font-family: "Bangers", cursive; font-weight: 400; font-size: 1.8rem; letter-spacing: 0.04em; }
    dialog p { font-size: 0.85rem; opacity: 0.8; margin: 4px 0 14px; }
    #qr { display: inline-block; padding: 10px; background: #fff; border-radius: 6px; }
    #qr img, #qr canvas { display: block; width: 200px; height: 200px; }
    dialog .actions { display: flex; gap: 8px; margin-top: 14px; }
    dialog .btn { flex: 1; color: var(--c-paper2); background: var(--c-brick); border: none; }
    dialog .btn.ghost { color: var(--c-ink); background: transparent; border: 1px solid var(--c-line); }

    .sheet {
      background: linear-gradient(180deg, var(--c-paper2), var(--c-paper));
      border-radius: 6px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(140,100,40,0.25);
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo .ui {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 3px solid var(--c-ink);
    }
    .logo h1 { font-family: "Bangers", cursive; font-size: 3.4rem; line-height: 1; letter-spacing: 0.04em; }
    .logo p { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; }
    .hint { font-size: 0.75rem; opacity: 0.7; margin: 12px 0 10px; }

    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--c-brick);
      color: var(--c-cream);
      font-family: "Bangers", cursive;
      font-style: italic;
      font-weight: 400;
      font-size: 1.4rem;
      letter-spacing: 0.06em;
      text-align: left;
      padding: 4px 10px;
    }
    tr:not(:first-child) th { border-top: 10px solid transparent; background-clip: padding-box; }
    td { border: 1px solid var(--c-line); height: 44px; }
    .name {
      padding: 0 8px;
      font-weight: 600;
    }
    .name > span { display: inline-flex; align-items: center; gap: 10px; }
    .icon {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      /* Sprite 6×4: --x columna (0-5), --y fila (0-3) */
      background: url(assets/clue/cards.webp) calc(var(--x) * 20%) calc(var(--y) * 100% / 3) / 600% 400%;
      border: 1px solid rgba(0,0,0,0.3);
    }
    tr:has(.cell[data-v="✗"]) .name { opacity: 0.45; }
    tr:has(.cell[data-v="✗"]) .label { text-decoration: line-through 2px var(--c-brick); }
    .cell {
      width: 64px;
      background: var(--c-paper2);
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .cell[data-v="✗"] { color: var(--c-brick); }
    footer { text-align: center; color: var(--c-cream); opacity: 0.6; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="toolbar">
      <a class="btn" href="index.html">← Juegos</a>
      <button id="share" class="btn"><span class="ui" style="--x:1;--y:1"></span>Compartir</button>
      <button id="reset" class="btn"><span class="ui" style="--x:2;--y:1"></span>Reiniciar</button>
    </nav>
    <div class="sheet">
      <div class="logo">
        <span class="ui" style="--x:0;--y:0"></span>
        <div>
          <h1>CLUE</h1>
          <p>Bloc de Hojas de Pistas</p>
        </div>
      </div>
      <p class="hint">Toca la casilla para marcar con ✗ lo que no fue.</p>
      <table id="card"></table>
    </div>
    <footer>Se guarda en este dispositivo.</footer>
  </div>

  <dialog id="share-dialog">
    <h2>Invita a jugar</h2>
    <p>Escanea el QR para abrir tu propia hoja de pistas.</p>
    <div id="qr"></div>
    <div class="actions">
      <button id="send-link" class="btn">Enviar enlace</button>
      <button class="btn ghost" onclick="this.closest('dialog').close()">Cerrar</button>
    </div>
  </dialog>

  <dialog id="reset-dialog">
    <h2>¿Nueva partida?</h2>
    <p>Se borrarán todas tus marcas.</p>
    <form method="dialog" class="actions">
      <button value="ok" class="btn">Borrar todo</button>
      <button value="" class="btn ghost">Cancelar</button>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // El orden debe coincidir con cards.webp (de izquierda a derecha, 6 por fila)
    // y el de las secciones con sus íconos en ui.webp (celdas 1, 2 y 3)
    const SECTIONS = {
      'Sospechosos': ['Coronel Mostaza', 'Profesor Moradillo', 'Sr. Verdi', 'Sra. Azulino', 'Srita. Escarlata', 'Sra. Blanco'],
      'Armas': ['Cuchillo', 'Candelabro', 'Pistola', 'Veneno', 'Cuerda', 'Pesas'],
      'Habitaciones': ['Vestíbulo', 'Comedor', 'Cocina', 'Patio', 'Observatorio', 'Teatro', 'Sala', 'Spa', 'Habitación de Huéspedes'],
    };
    const KEY = 'clue-card';

    let state = {};
    try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

    const card = document.getElementById('card');
    let sprite = 0;
    Object.entries(SECTIONS).forEach(([section, items], i) => {
      card.insertAdjacentHTML('beforeend', `<tr><th colspan="2"><span class="ui" style="--x:${(i + 1) % 3};--y:${Math.floor((i + 1) / 3)}"></span> ${section}</th></tr>`);
      for (const item of items) {
        const tr = card.insertRow();
        const name = tr.insertCell();
        name.className = 'name';
        name.innerHTML = `<span><span class="icon" style="--x:${sprite % 6};--y:${Math.floor(sprite / 6)}"></span><span class="label">${item}</span></span>`;
        sprite++;
        const id = `${item}#`;
        const td = tr.insertCell();
        td.className = 'cell';
        td.textContent = td.dataset.v = state[id] === '✗' ? '✗' : ''; // ignora marcas viejas ✓/?
        td.onclick = () => {
          state[id] = td.dataset.v ? '' : '✗';
          td.textContent = td.dataset.v = state[id];
          save();
        };
      }
    });

    const resetDialog = document.getElementById('reset-dialog');
    document.getElementById('reset').onclick = () => { resetDialog.returnValue = ''; resetDialog.showModal(); };
    resetDialog.onclose = () => {
      if (resetDialog.returnValue !== 'ok') return;
      state = {};
      save();
      location.reload();
    };

    // Compartir: QR + enlace a la hoja vacía (las marcas de cada jugador son secretas)
    const link = location.origin + location.pathname;
    const shareDialog = document.getElementById('share-dialog');
    const sendBtn = document.getElementById('send-link');
    new QRCode(document.getElementById('qr'), { text: link, width: 400, height: 400 });

    document.getElementById('share').onclick = () => shareDialog.showModal();
    sendBtn.onclick = async () => {
      if (navigator.share) {
        try { await navigator.share({ title: 'Clue — Hoja de pistas', url: link }); } catch {}
        return;
      }
      try {
        await navigator.clipboard.writeText(link);
        sendBtn.textContent = '¡Enlace copiado!';
      } catch {
        sendBtn.textContent = link;
      }
    };
  </script>
  <script src="dice.js"></script>
</body>
</html>
