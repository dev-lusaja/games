<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juegos</title>
  <meta name="description" content="Escoge tu juego: Ya! o la tarjeta de pistas de Clue." />
  <!-- Links viejos de sala (?room=XXX) siguen yendo al juego Ya! -->
  <script>if (location.search.includes('room=')) location.replace('ya.html' + location.search);</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --c-bg:      #0d0d14;
      --c-surface: #16162a;
      --c-border:  rgba(255,255,255,0.07);
      --c-accent:  #7c3aed;
      --c-ya:      #f59e0b;
      --c-clue:    #dc2626;
      --c-text:    #f1f5f9;
      --c-muted:   #94a3b8;
      font-family: "Outfit", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px 16px;
      background: var(--c-bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124,58,237,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(6,182,212,0.10) 0%, transparent 60%);
      color: var(--c-text);
    }
    h1 { font-size: clamp(2.5rem, 10vw, 4rem); font-weight: 900; letter-spacing: -0.03em; }
    p  { color: var(--c-muted); margin-top: -24px; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; width: 100%; max-width: 520px; }
    .game {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 28px 24px;
      border-radius: 24px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      color: inherit;
      text-decoration: none;
      transition: transform 0.2s, border-color 0.2s;
    }
    .game:hover, .game:focus-visible { transform: translateY(-4px); border-color: var(--accent); outline: none; }
    .game-icon  { font-size: 2.5rem; }
    .game-name  { font-size: 1.8rem; font-weight: 900; color: var(--accent); }
    .game-desc  { color: var(--c-muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>🎲 Juegos</h1>
  <p>Escoge tu juego</p>
  <main class="games">
    <a class="game" href="ya.html" style="--accent: var(--c-ya)">
      <span class="game-icon">⚡</span>
      <span class="game-name">Ya!</span>
      <span class="game-desc">¿Quién presiona primero? Compite en tiempo real.</span>
    </a>
    <a class="game" href="clue.html" style="--accent: var(--c-clue)">
      <span class="game-icon">🔍</span>
      <span class="game-name">Clue</span>
      <span class="game-desc">Tu hoja de pistas virtual para anotar tus investigaciones.</span>
    </a>
  </main>
</body>
</html>
