<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ya! — ¿Quién presiona primero?</title>
  <meta name="description" content="Compite con tus amigos en tiempo real. Presiona el botón ¡YA! antes que nadie y descubre quién reacciona más rápido." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Firebase SDK (CDN) -->
  <script type="module">
    // ╔══════════════════════════════════════════════════════════════════╗
    // ║          CONFIGURACIÓN DE FIREBASE — REEMPLAZA ESTOS VALORES    ║
    // ║                                                                  ║
    // ║  1. Ve a https://console.firebase.google.com                    ║
    // ║  2. Crea un proyecto (o usa uno existente)                      ║
    // ║  3. Agrega una app web y copia la config aquí abajo             ║
    // ║  4. En "Realtime Database" → Reglas, habilita lectura/escritura ║
    // ╚══════════════════════════════════════════════════════════════════╝
    const firebaseConfig = {
      apiKey:            "AIzaSyA50juVponPEalw3kKWTr4EAcpXIutVLD0",
      authDomain:        "ya-devlusaja-com.firebaseapp.com",
      databaseURL:       "https://ya-devlusaja-com-default-rtdb.firebaseio.com",
      projectId:         "ya-devlusaja-com",
      storageBucket:     "ya-devlusaja-com.firebasestorage.app",
      messagingSenderId: "845632791126",
      appId:             "1:845632791126:web:31c224455dba871d87d1f7"
    };
    // ════════════════════════════════════════════════════════════════════

    import { initializeApp }                        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, set, onValue,
             remove, serverTimestamp, get, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ─── Estado global ───────────────────────────────────────────────
    let app, db;
    let currentRoom   = null;
    let currentUser   = null;
    let currentUserId = null;
    let currentEmoji  = "😀";
    let hasPressed    = false;
    let isAdmin       = false;
    let rankingUnsub  = null;
    let roomStateUnsub = null;
    let usersUnsub    = null;
    let serverTimeOffset = 0;

    // ─── Init Firebase ───────────────────────────────────────────────
    function initFirebase() {
      app = initializeApp(firebaseConfig);
      db  = getDatabase(app);

      const offsetRef = ref(db, ".info/serverTimeOffset");
      onValue(offsetRef, (snap) => {
        serverTimeOffset = snap.val() || 0;
      });
    }

    function getServerTime() {
      return Date.now() + serverTimeOffset;
    }

    // ─── Helpers ─────────────────────────────────────────────────────
    function generateRoomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      return Array.from({ length: 5 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    }

    function generateId() {
      return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    function formatDelta(ms) {
      if (ms === 0) return "🥇 Primero";
      if (ms < 1000) return `+${ms} ms`;
      return `+${(ms / 1000).toFixed(2)} s`;
    }

    function medal(pos) {
      return ["🥇", "🥈", "🥉"][pos] ?? `${pos + 1}°`;
    }

    // ─── Pantalla de Entrada ─────────────────────────────────────────
    function showLobby() {
      document.getElementById("screen-lobby").style.display = "flex";
      document.getElementById("screen-game").style.display  = "none";
      if (rankingUnsub) { rankingUnsub(); rankingUnsub = null; }
      if (roomStateUnsub) { roomStateUnsub(); roomStateUnsub = null; }
      if (usersUnsub) { usersUnsub(); usersUnsub = null; }
    }

    async function showGame(roomCode, userName, emoji, isCreator = false) {
      document.getElementById("screen-lobby").style.display = "none";
      document.getElementById("screen-game").style.display  = "flex";
      document.getElementById("room-code-display").textContent = roomCode;
      document.getElementById("user-display").textContent = userName;
      document.getElementById("user-emoji").textContent = emoji;
      hasPressed = false;
      
      if (!currentUserId) currentUserId = generateId();

      const roomRef = ref(db, `rooms/${roomCode}`);
      const myUserRef = ref(db, `rooms/${roomCode}/users/${currentUserId}`);

      if (isCreator) {
        isAdmin = true;
        onDisconnect(roomRef).remove(); // Si el admin se va, se borra la sala
        await set(ref(db, `rooms/${roomCode}/admin`), currentUserId);
        await set(ref(db, `rooms/${roomCode}/state`), { status: "waiting" });
      } else {
        isAdmin = false;
      }

      // Presencia del usuario
      onDisconnect(myUserRef).remove();
      await set(myUserRef, { name: userName, emoji: emoji, timestamp: serverTimestamp() });

      subscribeUsers(roomCode);
      subscribeRoomState(roomCode);
      subscribeRanking(roomCode);
    }

    // ─── Botón ¡YA! ──────────────────────────────────────────────────
    function resetYaButton() {
      const btn = document.getElementById("ya-btn");
      btn.disabled = false;
      btn.classList.remove("pressed");
      btn.querySelector(".ya-label").textContent = "¡YA!";
    }

    function disableYaButton() {
      const btn = document.getElementById("ya-btn");
      btn.disabled = true;
      btn.classList.add("pressed");
      btn.querySelector(".ya-label").textContent = "✓ Enviado";
    }

    // ─── Registro de clic en Firebase ────────────────────────────────
    async function registerClick() {
      if (hasPressed || !currentRoom || !currentUser) return;
      hasPressed = true;
      disableYaButton();

      // Animar el botón con feedback visual
      const ripple = document.getElementById("ya-ripple");
      ripple.classList.add("animate");
      setTimeout(() => ripple.classList.remove("animate"), 600);

      const clicksRef = ref(db, `rooms/${currentRoom}/clicks`);
      const newClick  = push(clicksRef);
      await set(newClick, {
        userId:    currentUserId,
        user:      currentUser,
        emoji:     currentEmoji,
        timestamp: serverTimestamp()
      });

      // Ocultar botón y mostrar podio
      document.getElementById("ya-btn-wrapper").classList.add("hidden");
      document.getElementById("podium-area").classList.remove("hidden");
      document.getElementById("ya-instruction").textContent = "Resultados de la ronda 🏆";
      
      if (isAdmin) {
        document.getElementById("btn-reset").classList.remove("hidden");
      }
    }

    // ─── Estado de la sala ────────────────────────────────────────────
    function subscribeRoomState(roomCode) {
      if (roomStateUnsub) roomStateUnsub();
      
      const stateRef = ref(db, `rooms/${roomCode}/state`);
      roomStateUnsub = onValue(stateRef, (snapshot) => {
        const stateData = snapshot.val();
        
        // Si el estado es null y no eres admin, significa que la sala fue eliminada
        if (stateData === null && !isAdmin && currentUser) {
          showToast("El administrador cerró la sala.");
          document.getElementById("btn-back").click();
          return;
        }

        const status = typeof stateData === 'string' ? stateData : (stateData?.status || "waiting");

        const instr = document.getElementById("ya-instruction");
        const btnStart = document.getElementById("btn-start-round");
        const btnYaWrap = document.getElementById("ya-btn-wrapper");
        const countdownDisplay = document.getElementById("countdown-display");
        const podiumArea = document.getElementById("podium-area");
        const btnReset = document.getElementById("btn-reset");

        if (window.countdownInterval) {
          clearInterval(window.countdownInterval);
          window.countdownInterval = null;
        }

        if (status === "waiting") {
          hasPressed = false;
          resetYaButton();
          btnYaWrap.classList.add("hidden");
          countdownDisplay.classList.add("hidden");
          podiumArea.classList.add("hidden");
          
          if (isAdmin) {
            instr.textContent = "Cuando todos estén listos, presiona Empezar.";
            btnStart.classList.remove("hidden");
            btnReset.classList.add("hidden");
          } else {
            instr.textContent = "Esperando al administrador...";
            btnStart.classList.add("hidden");
            btnReset.classList.add("hidden");
          }
        } else if (status === "countdown") {
          instr.textContent = "¡Prepárate!";
          btnStart.classList.add("hidden");
          btnReset.classList.add("hidden");
          btnYaWrap.classList.add("hidden");
          podiumArea.classList.add("hidden");
          countdownDisplay.classList.remove("hidden");
          
          const targetTime = stateData.targetTime || (getServerTime() + 3000);
          let lastCount = -1;

          window.countdownInterval = setInterval(() => {
            const remaining = targetTime - getServerTime();
            if (remaining <= 0) {
              clearInterval(window.countdownInterval);
              countdownDisplay.classList.add("hidden");
              btnYaWrap.classList.remove("hidden");
              instr.textContent = "¡Presiona YA!";
            } else {
              const secondsLeft = Math.ceil(remaining / 1000);
              const displayText = secondsLeft > 3 ? "¡Listos!" : secondsLeft;

              if (displayText !== lastCount) {
                lastCount = displayText;
                
                countdownDisplay.textContent = displayText;
                if (secondsLeft > 3) {
                  countdownDisplay.style.fontSize = '3rem';
                } else {
                  countdownDisplay.style.fontSize = '8rem';
                }

                countdownDisplay.style.animation = 'none';
                countdownDisplay.offsetHeight;
                countdownDisplay.style.animation = null;
              }
            }
          }, 50); // Chequeo rápido de 50ms para máxima precisión
        }
      });
    }

    // ─── Usuarios conectados ──────────────────────────────────────────
    function subscribeUsers(roomCode) {
      if (usersUnsub) usersUnsub();
      
      const usersRef = ref(db, `rooms/${roomCode}/users`);
      usersUnsub = onValue(usersRef, (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById("users-list");
        const countEl = document.getElementById("users-count");
        
        if (!data) {
          countEl.textContent = "0";
          container.innerHTML = `<div class="ranking-empty"><p>Nadie conectado</p></div>`;
          return;
        }

        const users = Object.entries(data);
        countEl.textContent = users.length;
        
        container.innerHTML = users.map(([userId, info]) => {
          const isMe = userId === currentUserId;
          return `
            <div class="user-row ${isMe ? "me" : ""}">
              <span class="u-emoji">${escapeHtml(info.emoji || "😀")}</span>
              <span class="u-name">${escapeHtml(info.name)}${isMe ? " <span class='you-badge'>tú</span>" : ""}</span>
            </div>`;
        }).join("");
      });
    }

    // ─── Ranking en tiempo real (Podio) ───────────────────────────────
    function subscribeRanking(roomCode) {
      if (rankingUnsub) rankingUnsub();

      const clicksRef = ref(db, `rooms/${roomCode}/clicks`);
      rankingUnsub = onValue(clicksRef, (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById("podium-container");

        if (!data) {
          container.innerHTML = "";
          return;
        }

        const entries = Object.values(data)
          .filter(e => e.timestamp !== null)
          .sort((a, b) => a.timestamp - b.timestamp);

        if (entries.length === 0) {
          container.innerHTML = "";
          return;
        }

        const firstTs = entries[0].timestamp;
        const top3 = entries.slice(0, 3);
        
        let html = "";
        top3.forEach((entry, i) => {
          const pos = i + 1;
          const delta = entry.timestamp - firstTs;
          html += `
            <div class="podium-place pos-${pos}">
              <div class="podium-avatar">${escapeHtml(entry.emoji || "😀")}</div>
              <div class="podium-name">${escapeHtml(entry.user)}</div>
              <div class="podium-time">${formatDelta(delta)}</div>
              <div class="podium-step">${pos}</div>
            </div>
          `;
        });
        
        container.innerHTML = html;
      });
    }

    // ─── Reiniciar sala ───────────────────────────────────────────────
    async function resetRoom() {
      if (!currentRoom || !isAdmin) return;
      const clicksRef = ref(db, `rooms/${currentRoom}/clicks`);
      await remove(clicksRef);
      
      const stateRef = ref(db, `rooms/${currentRoom}/state`);
      await set(stateRef, { status: "waiting" });
      
      showToast("¡Sala reiniciada! 🚀");
    }

    // ─── Toast notification ───────────────────────────────────────────
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 3000);
    }

    // ─── Escape HTML ──────────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ─── Copiar código de sala ────────────────────────────────────────
    async function copyRoomCode() {
      try {
        await navigator.clipboard.writeText(currentRoom);
        showToast("Código copiado al portapapeles 📋");
      } catch {
        showToast(`Código de sala: ${currentRoom}`);
      }
    }

    // ─── DOM Ready ────────────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
      initFirebase();

      // ── Emoji picker ──
      const emojis = ["😀", "😎", "👾", "🦊", "🚀", "🦄", "👻", "🤠", "🤖", "🐱", "🐶", "🦁", "🐯", "🐼", "🐨", "🐸"];
      const btnEmoji = document.getElementById("btn-emoji");
      const emojiPopup = document.getElementById("emoji-popup");
      
      emojiPopup.innerHTML = emojis.map(e => `<button class="emoji-option" type="button">${e}</button>`).join("");
      
      btnEmoji.addEventListener("click", () => {
        emojiPopup.classList.toggle("hidden");
      });
      
      emojiPopup.addEventListener("click", (e) => {
        if(e.target.classList.contains("emoji-option")) {
          currentEmoji = e.target.textContent;
          btnEmoji.textContent = currentEmoji;
          emojiPopup.classList.add("hidden");
        }
      });
      
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".emoji-picker-container")) {
          emojiPopup.classList.add("hidden");
        }
      });

      // ── Lobby events ──
      // Botón Entrar: usa el código escrito manualmente
      document.getElementById("btn-enter").addEventListener("click", async () => {
        const name = document.getElementById("input-name").value.trim();
        const room = document.getElementById("input-room").value.trim().toUpperCase();

        if (!name) { showToast("Por favor ingresa tu nombre 👤"); return; }
        if (!room)  { showToast("Ingresa el código de sala para unirte 🏠"); return; }

        currentUser = name;
        currentRoom = room;
        showGame(room, name, currentEmoji, false);
      });

      // Botón Crear: genera código automáticamente y entra como admin
      document.getElementById("btn-new-room").addEventListener("click", () => {
        const name = document.getElementById("input-name").value.trim();
        if (!name) { showToast("Por favor ingresa tu nombre 👤"); return; }

        const room = generateRoomCode();
        document.getElementById("input-room").value = room;
        currentUser = name;
        currentRoom = room;
        showGame(room, name, currentEmoji, true);
      });

      // ── Game events ──
      document.getElementById("btn-start-round").addEventListener("click", async () => {
        if (!isAdmin || !currentRoom) return;
        const stateRef = ref(db, `rooms/${currentRoom}/state`);
        await set(stateRef, {
          status: "countdown",
          targetTime: getServerTime() + 4000 // 4 segundos en el futuro (1s para "¡Listos!" + 3s de cuenta)
        });
      });

      document.getElementById("ya-btn").addEventListener("click", registerClick);
      document.getElementById("btn-reset").addEventListener("click", resetRoom);
      document.getElementById("btn-back").addEventListener("click", async () => {
        if (currentUserId && currentRoom) {
          if (isAdmin) {
            await remove(ref(db, `rooms/${currentRoom}`));
          } else {
            await remove(ref(db, `rooms/${currentRoom}/users/${currentUserId}`));
          }
        }
        currentRoom  = null;
        currentUser  = null;
        currentUserId = null;
        showLobby();
      });
      document.getElementById("room-code-display").addEventListener("click", copyRoomCode);

      // Accesibilidad: Enter en los campos
      document.getElementById("input-name").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("input-room").focus();
      });
      document.getElementById("input-room").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("btn-enter").click();
      });
    });
  </script>

  <style>
    /* ══════════════════════════════════════════
       TOKENS & BASE
    ══════════════════════════════════════════ */
    :root {
      --c-bg:          #0d0d14;
      --c-surface:     #16162a;
      --c-surface2:    #1e1e38;
      --c-border:      rgba(255,255,255,0.07);
      --c-accent:      #7c3aed;
      --c-accent-glow: rgba(124,58,237,0.45);
      --c-accent2:     #06b6d4;
      --c-ya:          #f59e0b;
      --c-ya-pressed:  #374151;
      --c-ya-glow:     rgba(245,158,11,0.5);
      --c-text:        #f1f5f9;
      --c-muted:       #94a3b8;
      --c-gold:        #fbbf24;
      --c-silver:      #94a3b8;
      --c-bronze:      #d97706;
      --radius:        16px;
      --radius-lg:     24px;
      --transition:    0.25s cubic-bezier(0.4,0,0.2,1);
      font-family: "Outfit", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--c-bg);
      color: var(--c-text);
      overflow-x: hidden;
    }

    body {
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124,58,237,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(6,182,212,0.10) 0%, transparent 60%);
      min-height: 100dvh;
    }

    /* ══════════════════════════════════════════
       SCREENS
    ══════════════════════════════════════════ */
    .screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 0;
    }

    /* ══════════════════════════════════════════
       LOBBY SCREEN
    ══════════════════════════════════════════ */
    #screen-lobby {
      gap: 0;
    }

    .lobby-logo {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 40%, #06b6d4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 40px rgba(245,158,11,0.4));
      letter-spacing: -4px;
      user-select: none;
      animation: pulse-logo 3s ease-in-out infinite;
    }

    @keyframes pulse-logo {
      0%, 100% { filter: drop-shadow(0 0 40px rgba(245,158,11,0.4)); }
      50%       { filter: drop-shadow(0 0 70px rgba(245,158,11,0.7)); }
    }

    .lobby-tagline {
      margin-top: 8px;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      color: var(--c-muted);
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 48px;
    }

    .lobby-card {
      width: 100%;
      max-width: 420px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(124,58,237,0.1),
        0 24px 60px rgba(0,0,0,0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--c-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .form-input {
      background: var(--c-surface2);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      color: var(--c-text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      width: 100%;
      letter-spacing: 0.02em;
    }

    .form-input::placeholder { color: var(--c-muted); font-weight: 400; }

    .form-input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px var(--c-accent-glow);
    }

    .name-input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .emoji-picker-container {
      position: relative;
      display: flex;
    }

    .btn-emoji-select {
      background: var(--c-surface2);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-emoji-select:hover {
      background: rgba(124,58,237,0.15);
      border-color: var(--c-accent);
    }

    .emoji-popup {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
      backdrop-filter: blur(20px);
    }

    .emoji-popup.hidden {
      display: none;
    }

    .emoji-option {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: background var(--transition), transform var(--transition);
    }

    .emoji-option:hover {
      background: rgba(124,58,237,0.2);
      transform: scale(1.1);
    }

    .room-code-input {
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .lobby-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      color: var(--c-muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .lobby-divider::before,
    .lobby-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--c-border);
    }

    .btn-create {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      background: var(--c-surface2);
      color: var(--c-text);
      border: 1px solid rgba(124,58,237,0.3);
      box-shadow: 0 4px 20px rgba(124,58,237,0.15);
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), border-color var(--transition);
    }
    .btn-create:hover {
      background: rgba(124,58,237,0.18);
      border-color: rgba(124,58,237,0.6);
      box-shadow: 0 6px 28px rgba(124,58,237,0.35);
      transform: translateY(-2px);
    }
    .btn-create:active {
      transform: scale(0.97);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), opacity var(--transition);
      white-space: nowrap;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .btn-ghost {
      background: var(--c-surface2);
      color: var(--c-muted);
      border: 1px solid var(--c-border);
    }
    .btn-ghost:hover:not(:disabled) {
      background: rgba(124,58,237,0.15);
      color: var(--c-text);
      border-color: rgba(124,58,237,0.4);
    }

    .btn-accent {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-accent:hover:not(:disabled) {
      box-shadow: 0 6px 30px rgba(124,58,237,0.6);
      transform: translateY(-2px);
    }

    .btn-enter {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--c-ya), #f97316);
      color: #0d0d14;
      box-shadow: 0 4px 20px var(--c-ya-glow);
    }
    .btn-enter:hover {
      box-shadow: 0 8px 35px var(--c-ya-glow);
      transform: translateY(-2px);
    }

    /* ══════════════════════════════════════════
       GAME SCREEN
    ══════════════════════════════════════════ */
    #screen-game {
      display: none;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 0;
      gap: 0;
      min-height: 100dvh;
    }

    /* Header */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(22,22,42,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--c-border);
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 12px;
    }

    .header-logo {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #f59e0b, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .header-room {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--c-surface2);
      border: 1px solid var(--c-border);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      flex: 1;
      max-width: 240px;
    }
    .header-room:hover {
      border-color: rgba(124,58,237,0.5);
      background: rgba(124,58,237,0.1);
    }

    .room-label { font-size: 0.7rem; color: var(--c-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    .room-code  { font-size: 1rem; font-weight: 700; letter-spacing: 0.12em; color: var(--c-accent2); }
    .room-copy  { font-size: 0.8rem; margin-left: auto; color: var(--c-muted); }

    .header-user {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--c-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .header-user span { color: var(--c-text); }

    /* Main game layout */
    .game-main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0;
      min-height: 0;
    }

    @media (max-width: 768px) {
      .game-main { grid-template-columns: 1fr; }
    }

    /* YA button area */
    .ya-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 32px;
    }

    .ya-instruction {
      font-size: clamp(0.85rem, 2vw, 1rem);
      color: var(--c-muted);
      text-align: center;
      font-weight: 400;
    }

    /* THE BIG BUTTON */
    .ya-btn-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #ya-ripple {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 3px solid var(--c-ya);
      opacity: 0;
      pointer-events: none;
    }
    #ya-ripple.animate {
      animation: ripple-out 0.6s ease-out forwards;
    }
    @keyframes ripple-out {
      0%   { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    #ya-btn {
      width: clamp(200px, 38vw, 300px);
      height: clamp(200px, 38vw, 300px);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: radial-gradient(circle at 35% 35%, #fde68a, var(--c-ya) 60%, #b45309);
      color: #0d0d14;
      font-family: inherit;
      font-size: clamp(2.5rem, 7vw, 4rem);
      font-weight: 900;
      letter-spacing: -1px;
      position: relative;
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), filter var(--transition);
      box-shadow:
        0 0 0 8px rgba(245,158,11,0.15),
        0 0 40px var(--c-ya-glow),
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 2px 0 rgba(255,255,255,0.3);
      animation: ya-breathe 2.5s ease-in-out infinite;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes ya-breathe {
      0%, 100% {
        box-shadow: 0 0 0 8px rgba(245,158,11,0.15), 0 0 40px var(--c-ya-glow), 0 20px 60px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.3);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 20px rgba(245,158,11,0.08), 0 0 80px rgba(245,158,11,0.6), 0 20px 60px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.3);
        transform: scale(1.025);
      }
    }

    #ya-btn:hover:not(:disabled) {
      animation: none;
      transform: scale(1.06);
      box-shadow:
        0 0 0 14px rgba(245,158,11,0.2),
        0 0 80px rgba(245,158,11,0.7),
        0 30px 80px rgba(0,0,0,0.5),
        inset 0 2px 0 rgba(255,255,255,0.4);
    }

    #ya-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    #ya-btn.pressed {
      animation: none;
      background: radial-gradient(circle at 35% 35%, #374151, #1f2937 60%, #111827);
      cursor: not-allowed;
      box-shadow:
        0 0 0 8px rgba(55,65,81,0.2),
        0 0 20px rgba(0,0,0,0.4),
        0 10px 30px rgba(0,0,0,0.5),
        inset 0 2px 0 rgba(255,255,255,0.05);
      filter: none;
    }

    #ya-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.25) 0%, transparent 60%);
      pointer-events: none;
    }

    .ya-label {
      position: relative;
      z-index: 1;
      display: block;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .btn-reset-wrap {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-reset {
      background: var(--c-surface2);
      color: var(--c-muted);
      border: 1px solid var(--c-border);
      font-size: 0.85rem;
      padding: 10px 20px;
    }
    .btn-reset:hover {
      background: rgba(239,68,68,0.15);
      color: #fca5a5;
      border-color: rgba(239,68,68,0.4);
    }

    .btn-back-sm {
      background: transparent;
      color: var(--c-muted);
      border: 1px solid var(--c-border);
      font-size: 0.85rem;
      padding: 10px 20px;
    }
    .btn-back-sm:hover {
      background: var(--c-surface2);
      color: var(--c-text);
    }

    .hidden {
      display: none !important;
    }

    /* ══════════════════════════════════════════
       PODIUM & NEW UI
    ══════════════════════════════════════════ */
    .countdown-display {
      font-size: clamp(8rem, 20vw, 15rem);
      font-weight: 900;
      color: var(--c-ya);
      text-shadow: 0 10px 40px rgba(245,158,11,0.5);
      animation: pop-in 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
      user-select: none;
    }
    @keyframes pop-in {
      0% { transform: scale(0.5); opacity: 0; }
      20% { transform: scale(1.1); opacity: 1; }
      80% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .podium-area {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 300px;
      animation: slide-up 0.5s ease-out forwards;
    }

    .podium-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .podium-place {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 120px;
    }

    .podium-avatar {
      font-size: 2.5rem;
      background: var(--c-surface2);
      border: 2px solid var(--c-border);
      border-radius: 50%;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      position: relative;
      z-index: 2;
    }

    .podium-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--c-text);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .podium-time {
      font-size: 0.75rem;
      color: var(--c-muted);
      font-weight: 700;
    }

    .podium-step {
      width: 100%;
      background: linear-gradient(180deg, var(--c-surface2) 0%, var(--c-surface) 100%);
      border: 1px solid var(--c-border);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: center;
      padding-top: 12px;
      font-size: 2rem;
      font-weight: 900;
      color: rgba(255,255,255,0.2);
      box-shadow: inset 0 2px 10px rgba(255,255,255,0.05);
    }

    .podium-place.pos-1 .podium-step { height: 160px; border-color: rgba(251,191,36,0.4); background: linear-gradient(180deg, rgba(251,191,36,0.15) 0%, var(--c-surface) 100%); }
    .podium-place.pos-2 .podium-step { height: 110px; border-color: rgba(148,163,184,0.4); background: linear-gradient(180deg, rgba(148,163,184,0.1) 0%, var(--c-surface) 100%); }
    .podium-place.pos-3 .podium-step { height: 70px;  border-color: rgba(217,119,6,0.4); background: linear-gradient(180deg, rgba(217,119,6,0.15) 0%, var(--c-surface) 100%); }
    
    .podium-place.pos-1 .podium-avatar { border-color: var(--c-gold); box-shadow: 0 0 30px rgba(251,191,36,0.3); }
    .podium-place.pos-2 .podium-avatar { border-color: var(--c-silver); }
    .podium-place.pos-3 .podium-avatar { border-color: var(--c-bronze); }
    
    .podium-place.pos-2 { order: 1; }
    .podium-place.pos-1 { order: 2; z-index: 10; margin: 0 -10px; }
    .podium-place.pos-3 { order: 3; }

    @keyframes slide-up {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ══════════════════════════════════════════
       RIGHT PANEL (USERS)
    ══════════════════════════════════════════ */
    .right-panel {
      background: var(--c-surface);
      border-left: 1px solid var(--c-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100vh - 70px);
      position: sticky;
      top: 70px;
    }

    .right-panel-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--c-muted);
    }

    .panel-footer {
      padding: 16px;
      border-top: 1px solid var(--c-border);
      background: rgba(0,0,0,0.2);
    }

    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--c-surface2);
      border: 1px solid transparent;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .user-row.me {
      border-color: rgba(124,58,237,0.5);
      background: rgba(124,58,237,0.1);
    }
    .user-row .u-emoji { font-size: 1.3rem; }
    .user-row .u-name { font-weight: 600; color: var(--c-text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .you-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(124,58,237,0.3);
      color: #a78bfa;
      border: 1px solid rgba(124,58,237,0.4);
      border-radius: 4px;
      padding: 1px 5px;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .rank-time {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--c-accent2);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .ranking-row:first-child .rank-time { color: var(--c-gold); }

    /* ══════════════════════════════════════════
       TOAST
    ══════════════════════════════════════════ */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      backdrop-filter: blur(20px);
      color: var(--c-text);
      padding: 12px 24px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      text-align: center;
    }
    #toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ══════════════════════════════════════════
       RESPONSIVE TWEAKS
    ══════════════════════════════════════════ */
    @media (max-width: 480px) {
      .lobby-card { padding: 28px 20px; }
      .game-header { padding: 12px 16px; }
      .header-user { display: none; }
    }
  </style>
</head>
<body>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║          PANTALLA DE ENTRADA         ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <div id="screen-lobby" class="screen">
    <h1 class="lobby-logo">Ya!</h1>
    <p class="lobby-tagline">¿Quién reacciona más rápido? 🏆</p>

    <div class="lobby-card" role="main">
      <!-- Nombre -->
      <div class="form-group">
        <label class="form-label" for="input-name">Tu nombre o apodo</label>
        <div class="name-input-row">
          <div class="emoji-picker-container">
            <button id="btn-emoji" type="button" class="btn-emoji-select" aria-label="Seleccionar emoji">😀</button>
            <div id="emoji-popup" class="emoji-popup hidden">
              <!-- Se llena con JS -->
            </div>
          </div>
          <input
            id="input-name"
            class="form-input"
            type="text"
            placeholder="Ej: Flash ⚡"
            maxlength="24"
            autocomplete="nickname"
            spellcheck="false"
          />
        </div>
      </div>

      <!-- Código de sala (solo para unirse) -->
      <div class="form-group">
        <label class="form-label" for="input-room">Código de sala</label>
        <input
          id="input-room"
          class="form-input room-code-input"
          type="text"
          placeholder="XYZKW"
          maxlength="10"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <!-- Botón Entrar -->
      <button id="btn-enter" class="btn btn-enter" type="button">
        Entrar a la Sala →
      </button>

      <!-- Divisor -->
      <div class="lobby-divider">o</div>

      <!-- Botón Crear (genera código y entra automáticamente) -->
      <button id="btn-new-room" class="btn btn-create" type="button">
        ✨ Crear nueva sala
      </button>
    </div>
  </div>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║           PANTALLA DE JUEGO          ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <div id="screen-game" class="screen" role="main">

    <!-- Header -->
    <header class="game-header">
      <div class="header-logo" aria-label="Ya!">Ya!</div>

      <div class="header-room" id="room-code-display" role="button" tabindex="0"
           aria-label="Copiar código de sala" title="Clic para copiar">
        <div>
          <div class="room-label">Sala</div>
          <div class="room-code" id="room-code-display">──────</div>
        </div>
        <span class="room-copy">📋</span>
      </div>

      <div class="header-user">
        <span id="user-emoji">😀</span> <span id="user-display">—</span>
      </div>
    </header>

    <!-- Main layout: center area + right panel -->
    <div class="game-main">

      <!-- Center area -->
      <section class="ya-area">
        <p id="ya-instruction" class="ya-instruction">Esperando al administrador...</p>

        <!-- Botón de admin para empezar -->
        <button id="btn-start-round" class="btn btn-accent hidden" type="button" style="margin-top: 20px; font-size: 1.2rem; padding: 16px 32px;">
          ▶ Empezar Ronda
        </button>

        <!-- Countdown -->
        <div id="countdown-display" class="countdown-display hidden">3</div>

        <!-- THE BIG BUTTON -->
        <div id="ya-btn-wrapper" class="ya-btn-wrapper hidden">
          <div id="ya-ripple"></div>
          <button id="ya-btn" type="button" aria-label="Presionar Ya">
            <span class="ya-label">¡YA!</span>
          </button>
        </div>

        <!-- PODIUM -->
        <div id="podium-area" class="podium-area hidden">
           <div class="podium-container" id="podium-container">
             <!-- Se llena con JS -->
           </div>
        </div>

        <div class="btn-reset-wrap">
          <button id="btn-reset" class="btn btn-reset hidden" type="button">
            🔄 Reiniciar Sala
          </button>
        </div>
      </section>

      <!-- Users panel (right) -->
      <aside class="right-panel" aria-label="Usuarios conectados">
        <div class="right-panel-content">
          <div class="panel-header">
            <h2 class="panel-title">Jugadores (<span id="users-count">0</span>)</h2>
            <div class="ranking-dot" title="En vivo"></div>
          </div>
          <div id="users-list" class="users-list">
            <div class="ranking-empty">
              <span class="ranking-empty-icon">⏳</span>
              <p>Esperando participantes…</p>
            </div>
          </div>
        </div>
        
        <div class="panel-footer">
          <button id="btn-back" class="btn btn-back-sm" type="button" style="width: 100%;">
            ← Salir de la sala
          </button>
        </div>
      </aside>

    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
